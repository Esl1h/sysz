name: test
on: [push, pull_request, workflow_dispatch]

jobs:
  bats:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what MIN_FZF declares. The unit tests do not need
        # fzf at all, but the command line tests run the script, and the
        # script refuses to start without a new enough fzf.
        fzf: ["0.46.0", "latest"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Install fzf ${{ matrix.fzf }}
        run: |
          set -euo pipefail
          tag='${{ matrix.fzf }}'
          if [ "$tag" = latest ]; then
            tag=$(curl -fsSL https://api.github.com/repos/junegunn/fzf/releases/latest |
              sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p')
          fi
          # Older tags carry no "v" prefix, newer ones do. The asset name
          # never does.
          version=${tag#v}
          curl -fsSL "https://github.com/junegunn/fzf/releases/download/${tag}/fzf-${version}-linux_amd64.tar.gz" |
            sudo tar xz -C /usr/local/bin
          fzf --version

      - name: Run tests
        run: bats test/
