name: lint
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Run sh-checker
        uses: luizm/action-sh-checker@master
        env:
          # Both predate this fork. SC2294 is the eval in _sysz_run, which is
          # how every systemctl call is dispatched. SC2086 is "exit $CODE",
          # where quoting the variable would change the exit code the program
          # reports, because CODE is only assigned when the command fails.
          # Neither is safe to touch before there is a test suite.
          SHELLCHECK_OPTS: -e SC2294 -e SC2086
        with:
          sh_checker_exclude: "README.sh"
