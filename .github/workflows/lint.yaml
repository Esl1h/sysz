name: lint
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Run sh-checker
        uses: luizm/action-sh-checker@master
        env:
          # SC2294 is the eval in _sysz_run, which is how every systemctl
          # call is dispatched. It predates this fork and is not a drive-by
          # fix.
          SHELLCHECK_OPTS: -e SC2294
        with:
          # shfmt discovers the .bats files but cannot parse them: the
          # "@test name {" form is not shell syntax. The test workflow is
          # what checks them.
          sh_checker_exclude: "README.sh test/"
