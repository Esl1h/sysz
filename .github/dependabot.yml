version: 2

updates:
  # The workflows pin every action to a commit hash, which is what keeps a
  # moved tag from changing what runs in CI. The cost of pinning is that
  # nothing updates on its own, so Dependabot opens the pull requests.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci:"
    labels:
      - dependencies
