name: test
on: [push, pull_request, workflow_dispatch]

jobs:
  bats:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what MIN_FZF declares. The unit tests do not need
        # fzf at all, but the command line tests run the script, and the
        # script refuses to start without a new enough fzf.
        fzf: ["0.46.0", "latest"]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Resolve the fzf tag
        id: fzf
        run: |
          set -euo pipefail
          curl() { command curl --retry 5 --retry-delay 3 --retry-all-errors "$@"; }
          tag='${{ matrix.fzf }}'
          if [ "$tag" = latest ]; then
            tag=$(curl -fsSL https://api.github.com/repos/junegunn/fzf/releases/latest |
              sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p')
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

      - name: Restore fzf from cache
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/bin/fzf
          key: fzf-${{ steps.fzf.outputs.tag }}

      # Release downloads have returned 504 often enough to fail builds that
      # had nothing wrong with them, so this retries and, once it succeeds,
      # the cache above keeps it from being needed again.
      - name: Download fzf ${{ steps.fzf.outputs.tag }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl() { command curl --retry 5 --retry-delay 3 --retry-all-errors "$@"; }
          tag='${{ steps.fzf.outputs.tag }}'
          # Older tags carry no "v" prefix, newer ones do. The asset name
          # never does.
          curl -fsSL -o fzf.tar.gz "https://github.com/junegunn/fzf/releases/download/${tag}/fzf-${tag#v}-linux_amd64.tar.gz"
          mkdir -p ~/.local/bin
          tar xzf fzf.tar.gz -C ~/.local/bin
          rm fzf.tar.gz

      - name: Put fzf on PATH
        run: |
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
          "$HOME/.local/bin/fzf" --version

      - name: Run tests
        run: bats test/
