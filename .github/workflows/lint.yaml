name: lint
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shfmt
        run: |
          set -euo pipefail
          curl() { command curl --retry 3 --retry-delay 2 --retry-all-errors "$@"; }
          tag=$(curl -fsSL https://api.github.com/repos/mvdan/sh/releases/latest |
            sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p')
          curl -fsSL -o shfmt "https://github.com/mvdan/sh/releases/download/${tag}/shfmt_${tag}_linux_amd64"
          sudo install -m755 shfmt /usr/local/bin/shfmt
          rm shfmt
          shellcheck --version
          shfmt --version

      - name: shellcheck
        # SC2294 is the eval in _sysz_run, which is how every systemctl call
        # is dispatched. It predates this fork and is not a drive-by fix.
        run: shellcheck -e SC2294 sysz README.sh test/*.bats

      - name: shfmt
        # The .bats files are left out: "@test name {" is not shell syntax,
        # so shfmt cannot parse them. shellcheck above does read them.
        # No flags, so the settings in .editorconfig apply.
        run: shfmt -d sysz README.sh
